# Install step 17: health. The product fixes its own paths; none of
# this is a setting. The bounds the checks judge by have their defaults in the program
# (src/maildivvy/health/settings.py); an operator moves one in /etc/maildivvy/health.conf.

maildivvy_health_opt: /opt/maildivvy
maildivvy_health_program: "{{ maildivvy_health_opt }}/bin/maildivvy-health"
maildivvy_health_helper: "{{ maildivvy_health_opt }}/bin/maildivvy-health-helper"
# The report and the upstream answers it keeps: maildivvy-health's, readable by the
# operator's collector. src/maildivvy/health/settings.py's STATE_DIR; a unit test holds
# the two spellings together.
maildivvy_health_dir: /var/lib/maildivvy/health
maildivvy_health_report: "{{ maildivvy_health_dir }}/health.json"
maildivvy_health_user: maildivvy-health
maildivvy_health_unit: maildivvy-health.service
maildivvy_health_timer: maildivvy-health.timer
# The two helpers, started by systemd per connection: the store's as the mail owner, the
# system's as root. Their sockets are settings.py's STORE_SOCKET and SYSTEM_SOCKET.
maildivvy_health_store_socket: /run/maildivvy/health-store.sock
maildivvy_health_system_socket: /run/maildivvy/health-system.sock
maildivvy_health_store: /srv/maildivvy/store
maildivvy_health_index: /srv/maildivvy/index

# Every five minutes ("every few minutes"); a report three runs old is stale.
maildivvy_health_calendar: "*:0/5"
# A run reads every mailbox of every domain against the ledger.
maildivvy_health_run_timeout: 900

# What the step's proof accepts (docs/architecture.md § Installation, step 17): every
# subsystem PASS, or UNKNOWN only where no data exists yet. These are the checks that
# cannot read anything on a machine that holds no mail yet; any other UNKNOWN, and every
# FAIL, stops the install. `ban` and `network` are read by steps 18 and 19, which make
# what they check.
maildivvy_health_later_steps: [ban, network]
maildivvy_health_no_data_yet:
  - collection/external mailboxes
  # the fetch timer runs every few minutes: no fetch has run yet on a fresh install
  - collection/fetch runs
  # and so its journal holds no line yet to count unchecked deliveries in
  - collection/retrieval check
  - collection/deletion windows
  - store/ledger
  - store/link classes
  - search/search
  # the pass runs on the minute; steps 13 to 17 can all fall inside one minute (41 s on
  # the test VM, 2026-09-24), and then no pass has run yet when step 17 reads health
  - store/fan-out

# The proof, on the machine: argv is the report, the later steps and the no-data checks.
# A WARN is accepted and printed: it is a signal for the operator the install cannot act
# on (a self-signed certificate, a Sent link that failed yesterday), never a step that did
# not work. It prints every reading that is not accepted, and exits 1 then.
maildivvy_health_proof: |
  import json, sys
  path, later, no_data = sys.argv[1:4]
  later, no_data = set(later.split(",")), set(no_data.split(","))
  whole = json.load(open(path))
  assert whole["complete"] is True and len(whole["subsystems"]) == 15, "the report is not whole"
  wrong, warned, read = [], [], 0
  for subsystem in whole["subsystems"]:
      if subsystem["name"] in later:
          continue
      for check in subsystem["checks"]:
          read += 1
          key, state = subsystem["name"] + "/" + check["name"], check["state"]
          line = f"{state} {key}: {check['reading']} - {check['problem']}"
          if state == "WARN":
              warned.append(line)
          elif not (state == "PASS" or (state == "UNKNOWN" and key in no_data)):
              wrong.append(line)
  print("\n".join(wrong + warned) or f"{read} readings accepted")
  sys.exit(1 if wrong or not read else 0)
