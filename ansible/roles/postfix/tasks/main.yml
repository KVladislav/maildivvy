# Install step 9: Postfix's configuration. Step 7 installed the package, so the
# `postfix` account exists and Dovecot's SASL listener is owned by it.
#
# ⛔ Postfix has no include mechanism and `main.cf.d` is not a directory it reads: every
# setting here is written by `postconf`, which edits the named ones and leaves the
# distribution's files otherwise as they are. Nothing is appended.
#
# What the step leaves: submission on 465 alone in wrapper mode, SASL through Dovecot's
# socket, and no other listener - nothing on 25 at all, and `sendmail` for root alone;
# every transport `error`, so a sender sends only through its own per-sender
# map and nothing is delivered on the machine itself; the five maps keyed by sender and never by host; the rewrite in the SMTP client;
# the provider's certificate verified by name before its password is sent.
# 465 stays closed to the network by the firewall until publication (step 19).

- name: Install Postfix's lookup maps and the SASL client's mechanisms
  ansible.builtin.apt:
    name: "{{ maildivvy_postfix_packages }}"
    install_recommends: false
    lock_timeout: 600
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Read Postfix's version
  ansible.builtin.command:
    argv: [postconf, -h, mail_version]
  register: maildivvy_postfix_version
  changed_when: false

- name: Postfix is 3.10, the version this configuration is written and read back against
  ansible.builtin.assert:
    that: maildivvy_postfix_version.stdout is match('3\.10\.')
    fail_msg: "Postfix {{ maildivvy_postfix_version.stdout }}; the configuration is 3.10's"
    quiet: true

# --- the database role -------------------------------------------

# ⚠️ INSIDE THE CHROOT. `submissions` runs chrooted, so `smtpd` resolves the map's
# `passfile=/etc/postfix/…` against the queue directory, while `postmap` and the SMTP
# client resolve it for real. One file at both paths, not two copies that drift; without
# it every lookup fails `fe_sendauth: no password supplied`.
- name: Make the directory the passfile lives in, inside the chroot
  ansible.builtin.file:
    path: "{{ maildivvy_postfix_real_passfile | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Give the daemon's role LOGIN and its passfile, owned by the account Postfix runs as
  ansible.builtin.import_tasks: ../../postgresql/tasks/daemon_role.yml
  vars:
    maildivvy_daemon_db_role: "{{ maildivvy_postfix_db_role }}"
    maildivvy_daemon_passfile: "{{ maildivvy_postfix_real_passfile }}"
    maildivvy_daemon_reader: postfix
    maildivvy_daemon_db_host: "{{ maildivvy_postfix_db_host }}"

- name: The unchrooted path is a symlink to that one file
  ansible.builtin.file:
    src: "{{ maildivvy_postfix_real_passfile }}"
    dest: "{{ maildivvy_postfix_passfile }}"
    state: link
    owner: root
    group: root
    follow: false

# --- the six lookup maps ----------------------------------------------

- name: Write the six lookup maps, one view each
  ansible.builtin.template:
    src: map.cf.j2
    dest: "{{ maildivvy_postfix_map_dir }}/{{ maildivvy_postfix_map_prefix }}{{ item.name }}.cf"
    owner: root
    group: postfix
    mode: "0640"
  loop: "{{ maildivvy_postfix_maps }}"
  loop_control:
    label: "{{ item.name }}"
  register: maildivvy_postfix_maps_written

# --- the certificate ----------------------------------------------------

# ⛔ NO GROUP FOR THE KEY: smtpd opens the key as root, before it drops to
# `postfix` and enters the chroot, so `postfix` reads nothing through `ssl-cert` and is
# not put in it. A machine an earlier version installed has it there; it leaves, and the
# daemon is restarted below while any of its processes still holds the group, which a
# running one keeps from its start - read from the processes, not from this run,
# so a run stopped between the two is finished by the next.
- name: Read who is in ssl-cert
  ansible.builtin.command:
    argv: [getent, group, ssl-cert]
  register: maildivvy_postfix_ssl_cert
  changed_when: false

- name: The account Postfix runs as leaves ssl-cert, which an earlier version gave it
  ansible.builtin.command:
    argv: [gpasswd, -d, postfix, ssl-cert]
  when: "'postfix' in maildivvy_postfix_ssl_cert.stdout.split(':')[3].split(',')"
  changed_when: true

# `ps` exits 1 when the account runs nothing, as on a machine where Postfix is stopped
- name: Read the groups Postfix's running processes hold
  ansible.builtin.command:
    argv: [ps, -u, postfix, -o, supgrp=]
  register: maildivvy_postfix_running_groups
  changed_when: false
  failed_when: maildivvy_postfix_running_groups.rc not in [0, 1]

# --- main.cf and master.cf ------------------

- name: Set what the product owns in main.cf and master.cf
  maildivvy_postconf:
    main: "{{ maildivvy_postfix_main }}"
    services: "{{ maildivvy_postfix_services }}"
    absent: "{{ maildivvy_postfix_absent }}"
  register: maildivvy_postfix_written

# ⛔ Before the restart, never after it: it reports a syntax error while the old service
# is still running, and a restart on a broken master.cf leaves nothing listening.
- name: The whole configuration parses (postfix check)
  ansible.builtin.command:
    argv: [postfix, check]
  changed_when: false

# Not "this run wrote it": a run stopped between the write and the restart leaves the
# files as this step writes them and the daemon on the old ones, for ever. The master's own
# last read of them is what they are compared with: its start, or its last `reload` line,
# since step 14 edits master.cf on every run and reloads after (maildivvy_stale).
- name: Is any of the configuration newer than the master's last read of it?
  maildivvy_stale:
    unit: postfix
    reloaded: {identifier: postfix/master, match: '^(daemon started|reload) -- '}
    paths: "{{ ['/etc/postfix/main.cf', '/etc/postfix/master.cf', maildivvy_postfix_real_passfile]
               + maildivvy_postfix_maps | map(attribute='name')
                 | map('regex_replace', '^(.*)$', maildivvy_postfix_map_dir ~ '/' ~ maildivvy_postfix_map_prefix ~ '\\1.cf')
                 | list }}"
  register: maildivvy_postfix_stale

- name: Restart Postfix for the new configuration
  ansible.builtin.systemd:
    name: postfix
    state: restarted
  when: maildivvy_postfix_stale.stale
    or 'ssl-cert' in maildivvy_postfix_running_groups.stdout | regex_findall('[^,\\s]+')

- name: Postfix runs and starts at boot
  ansible.builtin.systemd:
    name: postfix
    state: started
    enabled: true

# --- the step's own proofs ----------------------------------------------------------------
# `postconf` reads the files, never the running master; what makes them the master's values
# is the restart above, whenever the files are newer than its last read of them.

# Appending would make every one of these print `overriding earlier entry` for ever
- name: Read main.cf back, with the warnings a duplicated setting prints
  ansible.builtin.command:
    argv: [postconf, -n]
  register: maildivvy_postfix_effective
  changed_when: false

- name: No setting is in main.cf twice
  ansible.builtin.assert:
    that: "'overriding earlier entry' not in maildivvy_postfix_effective.stderr"
    fail_msg: "{{ maildivvy_postfix_effective.stderr }}"
    quiet: true

- name: Read each setting back as Postfix parses it
  ansible.builtin.command:
    argv: [postconf, -h, "{{ item.key }}"]
  loop: "{{ maildivvy_postfix_main | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: maildivvy_postfix_read
  changed_when: false

- name: Each setting reads as written
  ansible.builtin.assert:
    that: item.stdout == item.item.value | string
    fail_msg: "{{ item.item.key }} reads {{ item.stdout }}, not {{ item.item.value }}"
    quiet: true
  loop: "{{ maildivvy_postfix_read.results }}"
  loop_control:
    label: "{{ item.item.key }}"

- name: Read the listeners the daemon holds
  ansible.builtin.shell:
    cmd: ss -ltnH | awk '{print $4}' | sort -u
  register: maildivvy_postfix_ports
  changed_when: false

# The distribution's bare `smtp inet` would bind the LAN address as well,
# and the predecessor's loopback listener relayed for any local process
- name: Nothing listens on 25, and 465 is served
  ansible.builtin.assert:
    that:
      - maildivvy_postfix_ports.stdout_lines | select('search', ':25$') | list == []
      - maildivvy_postfix_ports.stdout_lines | select('search', ':465$') | list == ['0.0.0.0:465']
      - maildivvy_postfix_ports.stdout_lines | select('search', ':587$') | list == []
    fail_msg: "{{ maildivvy_postfix_ports.stdout_lines }}"
    quiet: true

# the daemon holds the pair it serves, read as root; what its account can open is
# no proof of that, and `postfix` opens neither file. The handshake is over loopback, and
# the certificate it presents is compared with the published one, the leaf of an ACME
# chain on either side.
- name: Read the certificate 465 serves
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      openssl s_client -connect 127.0.0.1:465 -servername {{ maildivvy_cert_name | quote }} </dev/null 2>/dev/null
      | openssl x509 -noout -fingerprint -sha256
    executable: /bin/bash
  register: maildivvy_postfix_served
  changed_when: false

- name: Read the published certificate
  ansible.builtin.command:
    argv: [openssl, x509, -noout, -fingerprint, -sha256, -in, "{{ maildivvy_published_cert }}"]
  register: maildivvy_postfix_published
  changed_when: false

- name: 465 serves the published certificate
  ansible.builtin.assert:
    that: maildivvy_postfix_served.stdout == maildivvy_postfix_published.stdout
    fail_msg: "465 serves {{ maildivvy_postfix_served.stdout }}, the published certificate is {{ maildivvy_postfix_published.stdout }}"
    quiet: true

# ⛔ `postmap -q` exits 1 BOTH for "no such key" and for "the database refused us". The
# correct answer for a name that does not exist is rc 1 with NO OUTPUT; a `fatal: query
# error` with rc 1 is the whole of Postfix being unable to look anything up, so what is
# read is stderr, never the exit code.
- name: Ask every map for a name that cannot exist
  ansible.builtin.command:
    argv: [postmap, -q, nobody@maildivvy-install.invalid,
           "pgsql:{{ maildivvy_postfix_map_dir }}/{{ maildivvy_postfix_map_prefix }}{{ item.name }}.cf"]
  loop: "{{ maildivvy_postfix_maps }}"
  loop_control:
    label: "{{ item.name }}"
  register: maildivvy_postfix_probe
  changed_when: false
  failed_when: maildivvy_postfix_probe.rc not in [0, 1]

- name: Every map reached the database and answered a correct miss
  ansible.builtin.assert:
    that:
      - item.rc == 1
      - item.stdout == ''
      - item.stderr == ''
    fail_msg: "{{ item.item.name }}: rc {{ item.rc }}, stderr {{ item.stderr }}"
    quiet: true
  loop: "{{ maildivvy_postfix_probe.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: The role logs in as itself with its own passfile, as the account Postfix runs as
  ansible.builtin.command:
    argv: [runuser, -u, postfix, --, env, "PGPASSFILE={{ maildivvy_postfix_passfile }}",
           psql, -X, -w, -At, -h, "{{ maildivvy_postfix_db_host }}", -U, "{{ maildivvy_postfix_db_role }}",
           -d, "{{ maildivvy_db_name }}", -c, "SELECT count(*) FROM postfix_sasl_password"]
  changed_when: false
