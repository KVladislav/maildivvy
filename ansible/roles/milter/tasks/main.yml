# Install step 14: the submission milter, started and proved to answer, and only then
# bound to submission. Step 9 deliberately left `smtpd_milters` unwritten
# and set no `milter_*` at all: with Postfix's fail-closed default a milter bound before
# it runs refuses every submission, so the order here is the whole point of the step.
#
# What the step leaves: pymilter from the distribution, its import proved as an
# unprivileged user; the daemon under its own no-login user with its socket inside
# Postfix's chroot; `milter_default_action = tempfail` and `milter_protocol = 6` in
# main.cf with the global binding empty; and `smtpd_milters` on `submissions` alone,
# written after the rollback against a nonexistent socket has been exercised on a loopback
# copy of `submissions`, which is never itself unbound.

# --- the library, before anything binds a socket --------------------

- name: Install pymilter, the distribution's
  ansible.builtin.apt:
    name: "{{ maildivvy_milter_packages }}"
    install_recommends: false
    lock_timeout: 600
  environment:
    DEBIAN_FRONTEND: noninteractive

# ⛔ it is a C extension, and its failure mode is a service that starts, binds and
# cannot answer while Postfix is already handing it messages
- name: The library imports as an unprivileged user
  ansible.builtin.command:
    argv: [runuser, -u, nobody, --, python3, -c, "import Milter; print(Milter.__file__)"]
  register: maildivvy_milter_import
  changed_when: false

- name: It is the library the program will import, not something of ours
  ansible.builtin.assert:
    that: maildivvy_milter_import.stdout is search('/Milter/')
    fail_msg: "import Milter answered {{ maildivvy_milter_import.stdout }}"
    quiet: true

# --- the daemon ----------------------------------------------

- name: Install the milter's unit
  ansible.builtin.template:
    src: maildivvy-milter.service.j2
    dest: "/etc/systemd/system/{{ maildivvy_milter_unit }}"
    owner: root
    group: root
    mode: "0644"
  register: maildivvy_milter_unit_written

# A run stopped between the unit and the restart leaves it written and not loaded;
# systemd says so, and the next run reloads and restarts.
- name: Read whether systemd has loaded the milter's unit as written
  ansible.builtin.command:
    argv: [systemctl, show, -p, NeedDaemonReload, --value, "{{ maildivvy_milter_unit }}"]
  register: maildivvy_milter_unit_stale
  changed_when: false

# ⚠️ THE ONLY LONG-RUNNING PROGRAM OF OURS SO FAR: the timers' programs pick up new
# code at their next run, this one holds what it imported at start. Step 13 writes the
# tree; if any of it, or the unit, is newer than the running daemon, the daemon is
# running what the machine no longer has. Not "this run wrote it": a run stopped before
# the restart wrote it too (ansible/library/maildivvy_stale.py).
- name: Is the unit or any of the code newer than the running daemon?
  maildivvy_stale:
    unit: "{{ maildivvy_milter_unit }}"
    paths: ["/etc/systemd/system/{{ maildivvy_milter_unit }}", "{{ maildivvy_milter_program }}",
            "{{ maildivvy_opt }}/lib/maildivvy"]
  register: maildivvy_milter_stale

- name: Restart the daemon for a unit or code that changed
  ansible.builtin.systemd_service:
    name: "{{ maildivvy_milter_unit }}"
    state: restarted
    daemon_reload: "{{ maildivvy_milter_unit_written.changed or maildivvy_milter_unit_stale.stdout == 'yes' }}"
  when: maildivvy_milter_stale.stale or maildivvy_milter_unit_stale.stdout == 'yes'

- name: The daemon runs and starts at boot
  ansible.builtin.systemd_service:
    name: "{{ maildivvy_milter_unit }}"
    enabled: true
    state: started

# ⚠️ `systemctl is-active` reads `active` for a daemon that started and could not open
# its socket, so the socket itself is waited for and then asked
- name: Wait for the socket to appear
  ansible.builtin.wait_for:
    path: "{{ maildivvy_milter_socket }}"
    state: present
    timeout: 30

- name: Read the socket and its directory back
  ansible.builtin.command:
    argv: [stat, -c, "%F %U:%G %a", "{{ item }}"]
  loop: ["{{ maildivvy_milter_socket_dir }}", "{{ maildivvy_milter_socket }}"]
  register: maildivvy_milter_stat
  changed_when: false

# ⛔ 2750 <milter user>:postfix on the directory and a group-writable socket, or every
# submission is deferred with a permission error naming nothing useful
- name: The directory is 2750 and the socket is group-writable by postfix
  ansible.builtin.assert:
    that:
      - maildivvy_milter_stat.results[0].stdout == 'directory ' ~ maildivvy_milter_user ~ ':postfix 2750'
      - maildivvy_milter_stat.results[1].stdout == 'socket ' ~ maildivvy_milter_user ~ ':postfix 770'
    fail_msg: "{{ maildivvy_milter_stat.results | map(attribute='stdout') | list }}"
    quiet: true

# ⛔ the proof the daemon ANSWERS, in the protocol's own words, before anything is bound
# to it
- name: Negotiate with the socket
  ansible.builtin.command:
    argv: ["{{ maildivvy_milter_program }}", --probe, --socket, "{{ maildivvy_milter_socket }}"]
  register: maildivvy_milter_probe
  changed_when: false

- name: It negotiated the protocol version Postfix will speak
  ansible.builtin.assert:
    that: maildivvy_milter_probe.stdout is search('negotiated version ' ~ maildivvy_milter_main.milter_protocol)
    fail_msg: "{{ maildivvy_milter_probe.stdout }}"
    quiet: true

# ⚠️ without an explicit `--db-conf` the program would fall back on another consumer's
# connection file, which this user cannot read: it would fail closed at the lookup and
# defer every submission, while its own files read exactly as expected
# ⚠️ the RUNNING PROCESS's own lines, never the unit's whole history: a daemon that was
# restarted for a test, or that failed once and came back, would otherwise be read
# through what an earlier process said.
- name: Read the running daemon's own log
  ansible.builtin.command:
    argv: [sh, -c, 'journalctl -u "$1" _PID="$(systemctl show -p MainPID --value "$1")" --no-pager', -,
           "{{ maildivvy_milter_unit }}"]
  register: maildivvy_milter_log
  changed_when: false

- name: It opened its own connection file and was refused nothing
  ansible.builtin.assert:
    that:
      - maildivvy_milter_log.stdout is search('sender directory ' ~ (maildivvy_milter_db_conf | regex_escape))
      - "'Permission denied' not in maildivvy_milter_log.stdout"
      - "'Traceback' not in maildivvy_milter_log.stdout"
    fail_msg: "{{ maildivvy_milter_log.stdout }}"
    quiet: true

# --- main.cf: fail closed, and no global binding -----------------------

- name: Set the milter parameters the product owns
  maildivvy_postconf:
    main: "{{ maildivvy_milter_main }}"
  register: maildivvy_milter_written

- name: The whole configuration still parses
  ansible.builtin.command:
    argv: [postfix, check]
  changed_when: false

- name: Reload Postfix for the new parameters
  ansible.builtin.command:
    argv: [postfix, reload]
  when: maildivvy_milter_written is changed
  changed_when: true

# --- what submission is bound to now, read before anything is touched -------
#
# ⚠️ what the machine holds is read from `postconf -M` and `postconf -P` WITHOUT
# arguments: `-P` naming a service that does not exist prints `warning: unmatched
# request` on stderr and exits 0, which is also what a correctly absent override
# prints - indistinguishable without `-M`.
#
# ⛔ It is read HERE, before anything is written: what the run changed is the difference
# between this reading and the machine it leaves, and the drill's copy is made from it.

- name: Read the services and their overrides, whole
  ansible.builtin.command:
    argv: [postconf, "{{ item }}"]
  loop: [-M, -P]
  register: maildivvy_milter_machine
  changed_when: false

- name: Submission is a service of this machine, and this is what it is bound to
  ansible.builtin.set_fact:
    maildivvy_milter_service_exists: "{{ maildivvy_milter_machine.results[0].stdout_lines
      | select('match', (maildivvy_milter_service | regex_replace('/', ' ')) ~ ' ') | list | length > 0 }}"
    maildivvy_milter_bound_to: "{{ maildivvy_milter_machine.results[1].stdout_lines
      | select('match', (maildivvy_milter_service ~ '/smtpd_milters') | regex_escape ~ ' *=')
      | map('regex_replace', '^[^=]*= *', '') | list }}"

- name: The service `postconf -P` is about exists
  ansible.builtin.assert:
    that: maildivvy_milter_service_exists
    fail_msg: "{{ maildivvy_milter_service }} is not in postconf -M"
    quiet: true

# The drill's copy is made from what the machine holds: the definition without its `-o`
# lines, and every override but the binding, which the drill writes for itself.
- name: Read submission's definition and its overrides
  ansible.builtin.set_fact:
    maildivvy_milter_submission_definition: "{{ maildivvy_milter_machine.results[0].stdout_lines
      | select('match', (maildivvy_milter_service | regex_replace('/', ' ')) ~ ' ') | first
      | regex_replace(' +-o .*$', '') }}"
    maildivvy_milter_submission_overrides: "{{ dict(maildivvy_milter_submission_lines
      | map('regex_replace', '^[^/]*/[^/]*/([^ =]+).*$', '\\1')
      | zip(maildivvy_milter_submission_lines | map('regex_replace', '^[^=]*= *', '')))
      | dict2items | rejectattr('key', 'equalto', 'smtpd_milters') | items2dict }}"
  vars:
    maildivvy_milter_submission_lines: "{{ maildivvy_milter_machine.results[1].stdout_lines
      | select('match', (maildivvy_milter_service ~ '/') | regex_escape) | list }}"

# --- the rollback drill, on a submission service of its own ------
#
# ⛔ A rollback first attempted during an incident is one nobody has run. It is exercised
# on every run and leaves the machine as it found it, so none of its tasks reports a
# change; the reading it produces is only meaningful beside the two controls around it.
#
# ⛔ NEVER ON THE LIVE SERVICE. Taking the binding off `submissions` for the drill left
# authenticated submission with no From check and no scan for as long as the drill took,
# and an `smtpd` that accepted a connection inside that window kept its session unbound.
# The drill runs on a copy of `submissions` on the loopback: the same definition and the
# same overrides, compared below, under a name of its own in the log.

- name: Copy the submission probe onto the machine
  ansible.builtin.copy:
    src: submission-probe.py
    dest: "{{ maildivvy_milter_probe_program }}"
    owner: root
    group: root
    mode: "0755"

# ⛔ THE REAL BINDING IS WRITTEN WHATEVER HAPPENS IN THE DRILL, and the drill's service is
# removed whatever happens in it: both are the drill's `always`. A failed drill still
# fails the run.
- name: The rollback drill, on its own service, removed whatever happens in it
  block:
    - name: Set up the drill's copy of submission on the loopback
      maildivvy_postconf:
        services: "{{ {maildivvy_milter_drill_service: {'definition': maildivvy_milter_submission_definition
            | regex_replace('^[^ ]+', maildivvy_milter_drill_service | regex_replace('/inet$', '')),
          'overrides': maildivvy_milter_submission_overrides
            | combine({'syslog_name': 'postfix/milter-drill'})}} }}"
      changed_when: false

    - name: Bind the drill's service to a socket nothing listens on
      ansible.builtin.command:
        argv: [postconf, -P, "{{ maildivvy_milter_drill_service }}/smtpd_milters={{ maildivvy_milter_nonexistent }}"]
      changed_when: false

    - name: Reload Postfix onto the broken binding
      ansible.builtin.command:
        argv: [postfix, reload]
      changed_when: false

    # `postfix reload` returns before the master has opened the new listener; who holds
    # the port is read below
    - name: Wait for the drill's service to listen
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ maildivvy_milter_drill_port }}"
        timeout: 30

    - name: Read the drill's service back, and what listens on its port
      ansible.builtin.command:
        argv: "{{ item }}"
      loop:
        - [postconf, -P]
        - [ss, -Hltnp, sport, "=", ":{{ maildivvy_milter_drill_port }}"]
      register: maildivvy_milter_drill_read
      changed_when: false

    # ⛔ the drill proves a service configured like submission fails closed, not
    # submission itself: this is what keeps that honest
    - name: The drill's service is submission's, bound to the dead socket, on the loopback alone
      ansible.builtin.assert:
        that:
          - (maildivvy_milter_drilled | dict2items | rejectattr('key', 'in', maildivvy_milter_own) | items2dict)
            == (maildivvy_milter_submission_overrides | dict2items | rejectattr('key', 'in', maildivvy_milter_own) | items2dict)
          - maildivvy_milter_drilled.smtpd_milters == maildivvy_milter_nonexistent
          - maildivvy_milter_drill_read.results[1].stdout_lines | length > 0
          - maildivvy_milter_drill_read.results[1].stdout_lines | map('split') | map(attribute=3) | unique
            == ['127.0.0.1:' ~ maildivvy_milter_drill_port]
          # Postfix's own master holds it, not some other program on that port; an smtpd
          # child shares the listener, and ss lists its holders in no fixed order
          - maildivvy_milter_drill_read.results[1].stdout_lines | reject('search', '[(,]\("master",') | list == []
        fail_msg: "{{ maildivvy_milter_drill_read.results | map(attribute='stdout') | list }}"
        quiet: true
      vars:
        maildivvy_milter_own: [smtpd_milters, syslog_name]
        maildivvy_milter_drilled_lines: "{{ maildivvy_milter_drill_read.results[0].stdout_lines
          | select('match', (maildivvy_milter_drill_service ~ '/') | regex_escape) | list }}"
        maildivvy_milter_drilled: "{{ dict(maildivvy_milter_drilled_lines
          | map('regex_replace', '^[^/]*/[^/]*/([^ =]+).*$', '\\1')
          | zip(maildivvy_milter_drilled_lines | map('regex_replace', '^[^=]*= *', ''))) }}"

    - name: Ask the drill's service what it answers now
      ansible.builtin.command:
        argv: [python3, "{{ maildivvy_milter_probe_program }}", 127.0.0.1, "{{ maildivvy_milter_drill_port }}"]
      register: maildivvy_milter_broken
      changed_when: false

    - name: Clear the broken binding again
      ansible.builtin.command:
        argv: [postconf, -P, -X, "{{ maildivvy_milter_drill_service }}/smtpd_milters"]
      changed_when: false

    - name: Reload Postfix with nothing bound
      ansible.builtin.command:
        argv: [postfix, reload]
      changed_when: false

    - name: Ask the drill's service again, with nothing bound at all
      ansible.builtin.command:
        argv: [python3, "{{ maildivvy_milter_probe_program }}", 127.0.0.1, "{{ maildivvy_milter_drill_port }}"]
      register: maildivvy_milter_unbound
      changed_when: false

    - name: The broken binding refused temporarily and the rollback undid it
      ansible.builtin.assert:
        that:
          - (maildivvy_milter_broken.stdout | from_json).mail.code == '451'
          - (maildivvy_milter_unbound.stdout | from_json).mail.code != '451'
        fail_msg: "broken: {{ maildivvy_milter_broken.stdout }} / unbound: {{ maildivvy_milter_unbound.stdout }}"
        quiet: true

  # --- the drill's service gone, and the real binding, on `submissions` alone
  #
  # ⛔ the real binding is written once and never cleared: only when the machine does not
  # already hold it, so a re-run leaves the live service exactly as it was.
  always:
    - name: Remove the drill's service
      maildivvy_postconf:
        absent: ["{{ maildivvy_milter_drill_service }}"]
      changed_when: false

    - name: Bind the milter on submission, and nowhere else
      ansible.builtin.command:
        argv: [postconf, -P, "{{ maildivvy_milter_service }}/smtpd_milters={{ maildivvy_milter_binding }}"]
      when: maildivvy_milter_bound_to != [maildivvy_milter_binding]
      changed_when: true

    - name: The configuration parses with the binding in it
      ansible.builtin.command:
        argv: [postfix, check]
      changed_when: false

    - name: Reload Postfix onto the real binding, without the drill's service
      ansible.builtin.command:
        argv: [postfix, reload]
      changed_when: maildivvy_milter_bound_to != [maildivvy_milter_binding]

# --- the step's own proofs ----------------------------------------------------------------

- name: Read the binding back as Postfix parses it, after the reload that made it the master's
  ansible.builtin.command:
    argv: [postconf, "{{ item }}"]
  loop: [-P, -n, -M]
  register: maildivvy_milter_read
  changed_when: false

- name: Submission names the socket, and the global value is empty
  ansible.builtin.assert:
    that:
      - maildivvy_milter_service ~ '/smtpd_milters = ' ~ maildivvy_milter_binding
        in maildivvy_milter_read.results[0].stdout_lines
      - maildivvy_milter_read.results[0].stdout_lines
        | select('search', '/smtpd_milters *=') | list | length == 1
      - "'smtpd_milters =' in maildivvy_milter_read.results[1].stdout_lines"
      - "'non_smtpd_milters =' in maildivvy_milter_read.results[1].stdout_lines"
      - "'milter_default_action = tempfail' in maildivvy_milter_read.results[1].stdout_lines"
      - "'milter_protocol = 6' in maildivvy_milter_read.results[1].stdout_lines"
    fail_msg: "{{ maildivvy_milter_read.results[0].stdout }}"
    quiet: true

# ⛔ the drill's service does not outlive the step: not in master.cf, and not listening
- name: The drill's service is gone
  ansible.builtin.assert:
    that: (maildivvy_milter_drill_service | split('/') | first)
      not in (maildivvy_milter_read.results[2].stdout_lines | map('split') | map('first'))
    fail_msg: "{{ maildivvy_milter_read.results[2].stdout }}"
    quiet: true

- name: Nothing listens on the drill's port any more
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ maildivvy_milter_drill_port }}"
    state: stopped
    timeout: 30

- name: Ask submission one last time, with the daemon bound and answering
  ansible.builtin.command:
    argv: [python3, "{{ maildivvy_milter_probe_program }}"]
  register: maildivvy_milter_bound_probe
  changed_when: false

- name: Nothing is deferred now that the daemon it is bound to answers
  ansible.builtin.assert:
    that: (maildivvy_milter_bound_probe.stdout | from_json).mail.code != '451'
    fail_msg: "{{ maildivvy_milter_bound_probe.stdout }}"
    quiet: true
